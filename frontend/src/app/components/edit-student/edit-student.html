<div class="edit-student-container">

  <div class="form-card">

    <!-- ================= HEADER ================= -->

    <div class="form-header">

      <div>
        <h1>Edit Student</h1>
        <p>Update student information</p>
      </div>

      <button
        type="button"
        class="back-button"
        (click)="cancel()"
      >
        ← Back
      </button>

    </div>


    <!-- ================= LOADING ================= -->

    <div
      class="loading"
      *ngIf="!student.studentId && !errorMessage"
    >
      Loading student details...
    </div>


    <!-- ================= ERROR ================= -->

    <div
      class="error-message"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </div>


    <!-- ================= SUCCESS ================= -->

    <div
      class="success-message"
      *ngIf="successMessage"
    >
      {{ successMessage }}
    </div>


    <!-- ================= EDIT FORM ================= -->

    <form
      *ngIf="student.studentId"
      (ngSubmit)="updateStudent()"
    >

      <!-- Student ID -->

      <div class="form-group">

        <label>
          Student ID <span>*</span>
        </label>

        <input
          type="text"
          name="studentId"
          [(ngModel)]="student.studentId"
          placeholder="Example: STU001"
        />

      </div>


      <!-- Full Name -->

      <div class="form-group">

        <label>
          Full Name <span>*</span>
        </label>

        <input
          type="text"
          name="name"
          [(ngModel)]="student.name"
          placeholder="Enter student name"
        />

      </div>


      <!-- Email -->

      <div class="form-group">

        <label>
          Email <span>*</span>
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="student.email"
          placeholder="student@college.edu"
        />

      </div>


      <!-- Phone -->

      <div class="form-group">

        <label>
          Phone <span>*</span>
        </label>

        <input
          type="text"
          name="phone"
          [(ngModel)]="student.phone"
          placeholder="Enter phone number"
        />

      </div>


      <!-- Date of Birth -->

      <div class="form-group">

        <label>
          Date of Birth
        </label>

        <input
          type="date"
          name="dateOfBirth"
          [(ngModel)]="student.dateOfBirth"
        />

      </div>


      <!-- Gender -->

      <div class="form-group">

        <label>
          Gender
        </label>

        <select
          name="gender"
          [(ngModel)]="student.gender"
        >

          <option value="">
            Select Gender
          </option>

          <option value="Male">
            Male
          </option>

          <option value="Female">
            Female
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <!-- Address -->

      <div class="form-group full-width">

        <label>
          Address
        </label>

        <textarea
          name="address"
          [(ngModel)]="student.address"
          placeholder="Enter address"
          rows="3"
        ></textarea>

      </div>


      <!-- Department -->

      <div class="form-group">

        <label>
          Department <span>*</span>
        </label>

        <select
          name="department"
          [(ngModel)]="student.department"
        >

          <option value="">
            Select Department
          </option>

          <option
            *ngFor="let department of departments"
            [value]="department"
          >
            {{ department }}
          </option>

        </select>

      </div>


      <!-- Course -->

      <div class="form-group">

        <label>
          Course <span>*</span>
        </label>

        <input
          type="text"
          name="course"
          [(ngModel)]="student.course"
          placeholder="Example: B.Tech CSE"
        />

      </div>


      <!-- Semester -->

      <div class="form-group">

        <label>
          Semester <span>*</span>
        </label>

        <select
          name="semester"
          [(ngModel)]="student.semester"
        >

          <option value="">
            Select Semester
          </option>

          <option
            *ngFor="let semester of semesters"
            [value]="semester"
          >
            Semester {{ semester }}
          </option>

        </select>

      </div>


      <!-- Admission Year -->

      <div class="form-group">

        <label>
          Admission Year <span>*</span>
        </label>

        <input
          type="number"
          name="admissionYear"
          [(ngModel)]="student.admissionYear"
          placeholder="Example: 2023"
        />

      </div>

      <!-- Profile Picture -->

      <div class="form-group full-width">

        <label>
          Profile Picture
        </label>

        <div class="photo-upload-section">

          @if (photoPreview) {
            <div class="photo-preview-container">
              <img [src]="photoPreview" alt="Profile preview" class="photo-preview" />
              <button type="button" class="btn btn-sm btn-outline" (click)="clearPhoto()">
                Clear Photo
              </button>
            </div>
          } @else if (student.profilePicture) {
            <div class="photo-preview-container">
              <img [src]="student.profilePicture.startsWith('http') ? student.profilePicture : 'http://localhost:5000/uploads/' + student.profilePicture"
                   alt="Current profile"
                   class="photo-preview"
                   (error)="student.profilePicture = ''" />
              <button type="button" class="btn btn-sm btn-outline" (click)="clearPhoto()">
                Change Photo
              </button>
            </div>
          } @else {
            <label class="photo-upload-box">
              <div class="upload-icon">📷</div>
              <p>Click to upload or drag and drop</p>
              <p class="text-muted">PNG, JPG, JPEG up to 2MB</p>
              <input
                type="file"
                (change)="onFileSelected($event)"
                accept=".jpg,.jpeg,.png"
                style="display: none;"
              />
            </label>
          }

        </div>

      </div>


      <!-- ================= BUTTONS ================= -->

      <div class="form-actions">

        <button
          type="button"
          class="cancel-button"
          (click)="cancel()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="save-button"
          [disabled]="saving"
        >

          <span *ngIf="!saving">
            Save Changes
          </span>

          <span *ngIf="saving">
            Saving...
          </span>

        </button>

      </div>

    </form>

  </div>

</div>
